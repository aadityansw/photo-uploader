<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo uploader</title>
<style>
  :root {
    --bg: #f3f5f2;
    --surface: #ffffff;
    --ink: #1c2420;
    --muted: #5d6b63;
    --line: #d5dcd6;
    --accent: #1f5c4a;
    --accent-ink: #ffffff;
    --ok: #1f6b3a;
    --err: #a3262a;
    --drop: #e6efe9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141916;
      --surface: #1c231f;
      --ink: #e8eee9;
      --muted: #9aa8a0;
      --line: #2e3a33;
      --accent: #5fc4a0;
      --accent-ink: #0d1612;
      --ok: #6fd093;
      --err: #ff8a8d;
      --drop: #22302a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
    line-height: 1.5;
  }
  main { max-width: 880px; margin: 0 auto; padding: 48px 20px 80px; }
  h1 { font-size: 2rem; margin: 0 0 6px; letter-spacing: -0.02em; }
  .sub { color: var(--muted); margin: 0 0 28px; max-width: 56ch; }

  #drop {
    display: block;
    border: 2px dashed var(--line);
    border-radius: 14px;
    background: var(--surface);
    padding: 44px 20px;
    text-align: center;
    cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  #drop:hover, #drop:focus-within, #drop.over { background: var(--drop); border-color: var(--accent); }
  #drop strong { display: block; font-size: 1.1rem; }
  #drop span { color: var(--muted); font-size: .95rem; }
  #file { position: absolute; opacity: 0; width: 1px; height: 1px; }

  #previews { display: flex; flex-wrap: wrap; gap: 10px; margin: 18px 0 0; padding: 0; list-style: none; }
  #previews li { position: relative; width: 92px; height: 92px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); }
  #previews img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .row { display: flex; align-items: center; gap: 14px; margin-top: 18px; flex-wrap: wrap; }
  button {
    font: inherit; font-weight: 600;
    background: var(--accent); color: var(--accent-ink);
    border: 0; border-radius: 10px; padding: 11px 22px; cursor: pointer;
  }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button:focus-visible, #drop:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
  #status { font-size: .95rem; }
  #status.ok { color: var(--ok); }
  #status.err { color: var(--err); }
  #status.busy { color: var(--muted); }

  h2 { font-size: 1.15rem; margin: 48px 0 14px; }
  #gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
  #gallery a { display: block; aspect-ratio: 1; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: var(--surface); }
  #gallery img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #empty { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Photo uploader</h1>
  <p class="sub">Photos you add are saved to the <code>images</code> folder, then committed and pushed to your GitHub repository.</p>

  <label id="drop" for="file">
    <strong>Choose photos or drop them here</strong>
    <span>JPG, PNG, GIF, WebP · up to 25 MB each · 20 at a time</span>
    <input id="file" type="file" accept="image/*" multiple>
  </label>

  <ul id="previews"></ul>

  <div class="row">
    <button id="send" disabled>Upload and commit</button>
    <span id="status" role="status" aria-live="polite"></span>
  </div>

  <h2>Uploaded photos</h2>
  <div id="gallery"></div>
  <p id="empty" hidden>No photos yet. Upload your first one above.</p>
</main>

<script>
  const input = document.getElementById("file");
  const drop = document.getElementById("drop");
  const previews = document.getElementById("previews");
  const send = document.getElementById("send");
  const statusEl = document.getElementById("status");
  const gallery = document.getElementById("gallery");
  const empty = document.getElementById("empty");
  let selected = [];

  function setStatus(text, cls) { statusEl.textContent = text; statusEl.className = cls || ""; }

  function setFiles(files) {
    selected = [...files].filter(f => f.type.startsWith("image/")).slice(0, 20);
    previews.innerHTML = "";
    selected.forEach(f => {
      const li = document.createElement("li");
      const img = document.createElement("img");
      img.alt = f.name;
      img.src = URL.createObjectURL(f);
      li.appendChild(img);
      previews.appendChild(li);
    });
    send.disabled = selected.length === 0;
    setStatus(selected.length ? `${selected.length} photo${selected.length > 1 ? "s" : ""} ready` : "");
  }

  input.addEventListener("change", () => setFiles(input.files));
  ["dragenter", "dragover"].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", ev => setFiles(ev.dataTransfer.files));

  send.addEventListener("click", async () => {
    const body = new FormData();
    selected.forEach(f => body.append("photos", f));
    send.disabled = true;
    setStatus("Uploading and committing…", "busy");
    try {
      const res = await fetch("/api/upload", { method: "POST", body });
      const data = await res.json();
      if (data.ok) {
        setStatus(data.note, "ok");
        input.value = "";
        setFiles([]);
        setStatus(data.note, "ok");
      } else {
        setStatus(data.error || "Upload failed.", "err");
        send.disabled = false;
      }
    } catch (e) {
      setStatus("Could not reach the server. Is it running?", "err");
      send.disabled = false;
    }
    loadGallery();
  });

  async function loadGallery() {
    const res = await fetch("/api/images");
    const names = await res.json();
    gallery.innerHTML = "";
    empty.hidden = names.length > 0;
    names.forEach(n => {
      const a = document.createElement("a");
      a.href = "/images/" + encodeURIComponent(n);
      a.target = "_blank";
      const img = document.createElement("img");
      img.src = a.href;
      img.alt = n;
      img.loading = "lazy";
      a.appendChild(img);
      gallery.appendChild(a);
    });
  }
  loadGallery();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo uploader</title>
<style>
  :root {
    --bg: #f3f5f2;
    --surface: #ffffff;
    --ink: #1c2420;
    --muted: #5d6b63;
    --line: #d5dcd6;
    --accent: #1f5c4a;
    --accent-ink: #ffffff;
    --ok: #1f6b3a;
    --err: #a3262a;
    --drop: #e6efe9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141916;
      --surface: #1c231f;
      --ink: #e8eee9;
      --muted: #9aa8a0;
      --line: #2e3a33;
      --accent: #5fc4a0;
      --accent-ink: #0d1612;
      --ok: #6fd093;
      --err: #ff8a8d;
      --drop: #22302a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
    line-height: 1.5;
  }
  main { max-width: 880px; margin: 0 auto; padding: 48px 20px 80px; }
  h1 { font-size: 2rem; margin: 0 0 6px; letter-spacing: -0.02em; }
  .sub { color: var(--muted); margin: 0 0 28px; max-width: 56ch; }

  #drop {
    display: block;
    border: 2px dashed var(--line);
    border-radius: 14px;
    background: var(--surface);
    padding: 44px 20px;
    text-align: center;
    cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  #drop:hover, #drop:focus-within, #drop.over { background: var(--drop); border-color: var(--accent); }
  #drop strong { display: block; font-size: 1.1rem; }
  #drop span { color: var(--muted); font-size: .95rem; }
  #file { position: absolute; opacity: 0; width: 1px; height: 1px; }

  #items { list-style: none; margin: 18px 0 0; padding: 0; display: grid; gap: 10px; }
  #items li {
    display: flex; gap: 14px; align-items: center;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px;
  }
  #items img { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; flex: none; }
  .fields { flex: 1; min-width: 0; }
  .fields label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 3px; }
  .namebox { display: flex; align-items: center; gap: 6px; }
  .namebox input {
    flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
  }
  .namebox input:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
  .namebox input.bad { border-color: var(--err); }
  .ext { color: var(--muted); }
  .hint { font-size: .85rem; margin-top: 4px; color: var(--muted); word-break: break-all; }
  .hint.bad { color: var(--err); }
  .remove {
    background: transparent; color: var(--muted); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 10px; font-weight: 500; flex: none;
  }

  .row { display: flex; align-items: center; gap: 14px; margin-top: 18px; flex-wrap: wrap; }
  button {
    font: inherit; font-weight: 600;
    background: var(--accent); color: var(--accent-ink);
    border: 0; border-radius: 10px; padding: 11px 22px; cursor: pointer;
  }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #status { font-size: .95rem; }
  #status.ok { color: var(--ok); }
  #status.err { color: var(--err); }
  #status.busy { color: var(--muted); }

  h2 { font-size: 1.15rem; margin: 48px 0 14px; }
  #gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
  #gallery figure { margin: 0; }
  #gallery a { display: block; aspect-ratio: 1; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: var(--surface); }
  #gallery img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #gallery figcaption { font-size: .8rem; color: var(--muted); margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #empty { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Photo uploader</h1>
  <p class="sub">Name each photo before uploading. It is saved to the <code>images</code> folder under that name, then committed and pushed to GitHub.</p>

  <label id="drop" for="file">
    <strong>Choose photos or drop them here</strong>
    <span>JPG, PNG, GIF, WebP · up to 25 MB each · 10 at a time</span>
    <input id="file" type="file" accept="image/*" multiple>
  </label>

  <ul id="items"></ul>

  <div class="row">
    <button id="send" disabled>Upload and commit</button>
    <span id="status" role="status" aria-live="polite"></span>
  </div>

  <h2>Uploaded photos</h2>
  <div id="gallery"></div>
  <p id="empty" hidden>No photos yet. Upload your first one above.</p>
</main>

<script>
  const MAX_FILES = 10;
  const input = document.getElementById("file");
  const drop = document.getElementById("drop");
  const itemsEl = document.getElementById("items");
  const send = document.getElementById("send");
  const statusEl = document.getElementById("status");
  const gallery = document.getElementById("gallery");
  const empty = document.getElementById("empty");

  let items = [];          // { file, name, url }
  let existing = new Set(); // lowercase names (no extension) already in images/

  const stripExt = n => n.replace(/\.[^.]+$/, "");
  const extOf = n => (n.match(/\.[^.]+$/) || [".jpg"])[0].toLowerCase();
  // Same rules as the server's cleanName()
  const clean = s => s.trim()
    .replace(/\.(jpe?g|png|gif|webp|avif|heic|bmp|svg)$/i, "")
    .replace(/[^a-zA-Z0-9_-]+/g, "-")
    .replace(/^-+|-+$/g, "")
    .slice(0, 80);

  function setStatus(text, cls) { statusEl.textContent = text; statusEl.className = cls || ""; }

  // Returns an error message for item i, or "" if its name is fine.
  function problem(i) {
    const base = clean(items[i].name);
    if (!base) return "Enter a name.";
    const key = base.toLowerCase();
    if (existing.has(key)) return `"${base}" is already used. Choose a different name.`;
    if (items.some((o, j) => j !== i && clean(o.name).toLowerCase() === key))
      return `"${base}" is used twice in this upload.`;
    return "";
  }

  function refreshHints() {
    let anyBad = false;
    [...itemsEl.children].forEach((li, i) => {
      const msg = problem(i);
      const hint = li.querySelector(".hint");
      const field = li.querySelector("input");
      field.classList.toggle("bad", !!msg);
      hint.classList.toggle("bad", !!msg);
      hint.textContent = msg || `Will be saved as ${clean(items[i].name)}${extOf(items[i].file.name)}`;
      if (msg) anyBad = true;
    });
    send.disabled = items.length === 0 || anyBad;
  }

  function render() {
    itemsEl.innerHTML = "";
    items.forEach((it, i) => {
      const li = document.createElement("li");
      li.innerHTML = `
        <img alt="">
        <div class="fields">
          <label>Photo name</label>
          <div class="namebox"><input type="text" maxlength="80" autocomplete="off" spellcheck="false"><span class="ext"></span></div>
          <div class="hint"></div>
        </div>
        <button type="button" class="remove" aria-label="Remove this photo">Remove</button>`;
      li.querySelector("img").src = it.url;
      const field = li.querySelector("input");
      field.value = it.name;
      li.querySelector(".ext").textContent = extOf(it.file.name);
      field.addEventListener("input", () => { it.name = field.value; refreshHints(); });
      li.querySelector(".remove").addEventListener("click", () => {
        URL.revokeObjectURL(it.url);
        items.splice(i, 1);
        render();
      });
      itemsEl.appendChild(li);
    });
    refreshHints();
    if (items.length === 0 && !statusEl.classList.contains("ok")) setStatus("");
  }

  async function setFiles(fileList) {
    await loadGallery(); // refresh the list of taken names first
    const files = [...fileList].filter(f => f.type.startsWith("image/")).slice(0, MAX_FILES);
    items.forEach(it => URL.revokeObjectURL(it.url));
    items = files.map(f => ({ file: f, name: clean(stripExt(f.name)), url: URL.createObjectURL(f) }));
    if (fileList.length > MAX_FILES) setStatus(`Only the first ${MAX_FILES} photos were kept.`, "busy");
    else setStatus(files.length ? `${files.length} photo${files.length > 1 ? "s" : ""} ready. Edit the names if you like.` : "");
    render();
  }

  input.addEventListener("change", () => setFiles(input.files));
  ["dragenter", "dragover"].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", ev => setFiles(ev.dataTransfer.files));

  send.addEventListener("click", async () => {
    const body = new FormData();
    items.forEach(it => {
      body.append("photos", it.file);
      body.append("names", clean(it.name));
    });
    send.disabled = true;
    setStatus("Uploading and committing…", "busy");
    try {
      const res = await fetch("/api/upload", { method: "POST", body });
      const data = await res.json();
      if (data.ok) {
        items.forEach(it => URL.revokeObjectURL(it.url));
        items = [];
        input.value = "";
        render();
        setStatus(`${data.note} Saved: ${data.saved.join(", ")}`, "ok");
      } else {
        setStatus(data.error || "Upload failed.", "err");
        if (data.saved) { // photos were saved but git failed: clear the form
          items.forEach(it => URL.revokeObjectURL(it.url));
          items = [];
          input.value = "";
          render();
          setStatus(data.error, "err");
        }
      }
    } catch (e) {
      setStatus("Could not reach the server. Is it running?", "err");
    }
    await loadGallery();
    refreshHints();
  });

  async function loadGallery() {
    const res = await fetch("/api/images");
    const names = await res.json();
    existing = new Set(names.map(n => stripExt(n).toLowerCase()));
    gallery.innerHTML = "";
    empty.hidden = names.length > 0;
    names.forEach(n => {
      const fig = document.createElement("figure");
      const a = document.createElement("a");
      a.href = "/images/" + encodeURIComponent(n);
      a.target = "_blank";
      const img = document.createElement("img");
      img.src = a.href;
      img.alt = n;
      img.loading = "lazy";
      a.appendChild(img);
      const cap = document.createElement("figcaption");
      cap.textContent = n;
      fig.append(a, cap);
      gallery.appendChild(fig);
    });
  }
  loadGallery();
</script>
</body>
</html>
